\* Safety check: circular transaction topologies (r -> a -> b with b -> a or
\* b -> r transfer creating cycles), plus TDT eviction and coordinator retry.
SPECIFICATION Spec

CONSTANTS
  Root = r
  SubCoord = {a}
  DirectLeaf = {}
  SubLeaf = {b}
  IdleLS = {}
  HostedInit = {a, b}
  None = None
  MaxTransfers = 1
  AllowContextLoss = TRUE
  AllowTDTEvict = TRUE
  AllowRetry = TRUE

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT CommitRequiresAllPrepared
INVARIANT FirstParentAcyclic
INVARIANT TransferPrinciple
INVARIANT MinParticipantSet
INVARIANT ClientReplyConsistent
INVARIANT NoUnknownWhenTDTRetained

PROPERTY DecisionStable
PROPERTY StateMonotonic
