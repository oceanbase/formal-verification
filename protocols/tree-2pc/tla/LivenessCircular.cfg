\* Liveness check: circular transaction topology (r -> a -> b with b -> a or
\* b -> r cycle). No SYMMETRY.
SPECIFICATION LiveSpec

CONSTANTS
  Root = r
  SubCoord = {a}
  DirectLeaf = {}
  SubLeaf = {b}
  IdleLS = {}
  HostedInit = {a, b}
  None = None
  MaxTransfers = 1
  AllowContextLoss = TRUE
  AllowTDTEvict = TRUE
  AllowRetry = TRUE

PROPERTY EventuallyAllDecide
PROPERTY EventuallyAllTombstone
PROPERTY ClientEventuallyResolved
