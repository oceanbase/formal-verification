\* Safety check: 2-level hierarchical tree (r -> {a, b}, a -> {c}) with
\* context loss, TDT eviction, and recreated-coordinator retries.
SPECIFICATION Spec

CONSTANTS
  Root = r
  SubCoord = {a}
  DirectLeaf = {b}
  SubLeaf = {c}
  IdleLS = {}
  HostedInit = {a, b, c}
  None = None
  MaxTransfers = 0
  AllowContextLoss = TRUE
  AllowTDTEvict = TRUE
  AllowRetry = TRUE

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT CommitRequiresAllPrepared
INVARIANT FirstParentAcyclic
INVARIANT TransferPrinciple
INVARIANT MinParticipantSet
INVARIANT ClientReplyConsistent
INVARIANT NoUnknownWhenTDTRetained

PROPERTY DecisionStable
PROPERTY StateMonotonic
