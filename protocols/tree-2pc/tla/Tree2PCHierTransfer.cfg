\* Safety check: 5-log-stream hierarchical commit tree (r -> {a, b}, a -> {c})
\* with a fresh transfer target d1, 3 partitions, context loss, TDT eviction,
\* and recreated-coordinator retries.
SPECIFICATION Spec

CONSTANTS
  Root = r
  SubCoord = {a}
  DirectLeaf = {b}
  SubLeaf = {c}
  IdleLS = {d1}
  HostedInit = {a, b, c}
  None = None
  MaxTransfers = 1
  AllowContextLoss = TRUE
  AllowTDTEvict = TRUE
  AllowRetry = TRUE

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT CommitRequiresAllPrepared
INVARIANT FirstParentAcyclic
INVARIANT TransferPrinciple
INVARIANT MinParticipantSet
INVARIANT ClientReplyConsistent
INVARIANT NoUnknownWhenTDTRetained

PROPERTY DecisionStable
PROPERTY StateMonotonic
