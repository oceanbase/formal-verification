\* Liveness check: two-branch diamond / cross-branch transfers (r -> {a, b}
\* with 2 partitions migrating into shared fresh stream d1 or across branches).
\* No SYMMETRY (unsound for TLC liveness checking).
SPECIFICATION LiveSpec

CONSTANTS
  Root = r
  SubCoord = {}
  DirectLeaf = {a, b}
  SubLeaf = {}
  IdleLS = {d1}
  HostedInit = {a, b}
  None = None
  MaxTransfers = 2
  AllowContextLoss = FALSE
  AllowTDTEvict = FALSE
  AllowRetry = FALSE

PROPERTY EventuallyAllDecide
PROPERTY EventuallyAllTombstone
PROPERTY ClientEventuallyResolved
