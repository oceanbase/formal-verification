  None = None
  MaxTransfers = 2
  AllowContextLoss = FALSE
  AllowTDTEvict = FALSE
  AllowRetry = FALSE

PROPERTY EventuallyAllDecide
PROPERTY EventuallyAllTombstone
PROPERTY ClientEventuallyResolved
