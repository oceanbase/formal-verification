\* Liveness check: multi-hop chain transfers across 4 log streams (MaxTransfers = 2).
\* No SYMMETRY.
SPECIFICATION LiveSpec

CONSTANTS
  Root = r
  SubCoord = {}
  DirectLeaf = {a}
  SubLeaf = {}
  IdleLS = {d1, d2}
